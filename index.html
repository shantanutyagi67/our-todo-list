<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9e8ed" />
    <meta
      name="description"
      content="A shared little list of adventures, food, rain, and wonderfully odd plans."
    />
    <title>Things We Shall Do ✦</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <div class="ornament ornament--left" aria-hidden="true">✦</div>
        <div class="ornament ornament--right" aria-hidden="true">♡</div>

        <header class="hero">
          <p class="eyebrow">the very important list</p>
          <h1 id="page-title">Things we<br /><em>shall do</em></h1>
          <p class="subtitle">Tiny adventures, strange plans, and everything in between.</p>
        </header>

        <div class="progress-wrap" aria-label="List progress">
          <div class="progress-labels">
            <span id="progress-copy">Loading our list…</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true"><div id="progress-bar"></div></div>
        </div>

        <section aria-label="Our todo list">
          <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
          <p id="empty-state" class="empty-state" hidden>New chapter? Add the first plan below ✦</p>
        </section>

        <form id="add-form" class="add-form">
          <label class="sr-only" for="new-task">Add a new thing to do</label>
          <input
            id="new-task"
            name="new-task"
            type="text"
            maxlength="180"
            placeholder="Add another little plan…"
            autocomplete="off"
            required
          />
          <button type="submit" aria-label="Add this item">Add <span aria-hidden="true">+</span></button>
        </form>

        <p id="connection-note" class="connection-note" role="status"></p>
        <footer>made for two people who are very good at making plans ♡</footer>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
