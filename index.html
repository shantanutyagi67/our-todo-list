<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9e8ed" />
    <meta name="robots" content="noindex" />
    <title>Incorrect page</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 12%, #fff1b8 0 9%, transparent 31%),
          radial-gradient(circle at 85% 86%, #f7cedc 0 10%, transparent 34%),
          linear-gradient(135deg, #fff7fb, #f9e8ed);
        color: #38272f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 520px);
        padding: 34px;
        border: 1px solid rgb(255 255 255 / 82%);
        border-radius: 28px;
        background: rgb(255 250 247 / 88%);
        box-shadow: 0 24px 60px rgb(118 59 75 / 14%);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 3.2rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #7f6d76;
        font-weight: 700;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Incorrect page</h1>
      <p>This is not a todo list page. Please open the exact list link you were given.</p>
    </main>
  </body>
</html>
